# Сценарий 1 — ГТР после неэффективных СИОЗС, СИОЗСН и буспирона. Пациент вымышленный.
# Основа — опубликованный клинический случай (PMC7653736), не пациент из практики.
id: s1
title_ru: "ГТР после неэффективных СИОЗС, СИОЗСН и буспирона"
status: validated
author_ru: "врач команды"
show_ru: "Неэффективность СИОЗСН и СИОЗС (первая линия по клиническим рекомендациям) и буспирона; противопоказаний нет"
complaints_ru: "Чрезмерная тревога и беспокойство почти каждый день недели в течение 8 месяцев; усталость, раздражительность, бессонница"

patient:
  full_name: "Сценарий 1: мужчина, 63 года"
  email: scenario1@example.com
  sex: male
  age: 63

# Анамнез — пересказ случая PMC7653736 (случай 1) и complaints_ru, 27.10. TODO(Савва): проверить пересказ.
anamnesis:
  complaints: >-
    Чрезмерная тревога и беспокойство почти каждый день; усталость, раздражительность, мышечное напряжение.
    Плохо спит: просыпается около 4 утра и больше не засыпает.
  history: >-
    Тревожные симптомы около 8 месяцев. Лечился у терапевта поликлиники без достаточного эффекта: пароксетин,
    затем венлафаксин пролонгированного действия, оба в максимальных дозах и без побочных эффектов. На венлафаксине
    через 16 недель симптомы сохранялись; добавлен буспирон до максимальной переносимой дозы — тревога по-прежнему
    мешает повседневной жизни. Регулярно ходит на когнитивно-поведенческую терапию и выполняет домашние задания.
    Терапевт направил к психиатру.
  notes: >-
    Гипертоническая болезнь и сахарный диабет 2 типа компенсированы. Аллергии не известны. Осмотр, анализы
    и показатели жизнедеятельности — без отклонений.

# Источники и даты постановки — черновик команды 27.10. TODO(Савва): проверить.
diagnoses:
  - { icd10: "F41.1", title: "Генерализованное тревожное расстройство", source: discharge,
      source_note: "направление терапевта", diagnosed_ago: 8m }
  - { icd10: "I11.9", title: "Гипертоническая болезнь с поражением сердца без сердечной недостаточности",
      source: mis, source_note: "поликлиника", diagnosed_ago: 9y }
  - { icd10: "E11", title: "Сахарный диабет 2 типа", source: mis, source_note: "поликлиника",
      diagnosed_ago: 6y }

# В опубликованном случае анализы «в пределах нормы» без значений; значения подобрала команда.
# СКФ по CKD-EPI 2021 для мужчины 63 лет при креатинине 84 мкмоль/л — около 90.
labs:
  - { analyte: creatinine, value: 84, days_ago: 20, source_note: "поликлиника" }
  - { analyte: egfr, value: 90, days_ago: 20, source_note: "поликлиника" }
  - { analyte: alt, value: 26, days_ago: 20, source_note: "поликлиника" }
  - { analyte: ast, value: 23, days_ago: 20, source_note: "поликлиника" }
  - { analyte: bilirubin, value: 13, days_ago: 20, source_note: "поликлиника" }
  - { analyte: albumin, value: 43, days_ago: 20, source_note: "поликлиника" }

past_medications: ["Буспирон", "Венлафаксин", "Пароксетин"]   # без эффекта

# Две недели до визита — исходное состояние; на демо врач назначает Авиандр и видит пункты инструкции.
