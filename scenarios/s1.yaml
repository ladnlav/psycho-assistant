    anxiety: 8
    mood: 4
    sleep: 3
    gad7: 14                     # ниже 15 — правило «выраженная тревога» не направляет к психиатру
    phq9: 8
    phq9_item9: 0
    messages: ["Тревога не отпускает уже который месяц, просыпаюсь в 4 утра и больше не сплю"]
    expected_ru: "Исходное состояние: GAD-7 14 — умеренная тревога, PHQ-9 8"
  - week: 1
    anxiety: 8
    mood: 4
    sleep: 3
    expected_ru: >-
      Визит: врач видит неэффективность пароксетина, венлафаксина и буспирона и назначает Авиандр.
      С осторожностью: сердечно-сосудистое заболевание (I11.9), сахарный диабет (E11);
      пять противопоказаний — «проверьте у пациента», у почек и печени — анализы из карточки (СКФ 90)

