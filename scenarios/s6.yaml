# Сценарий 6 — когда назначить Авиандр. Пациентка вымышленная.
# Основа — опубликованный клинический случай, не пациент из практики:
# https://probolezny.ru/trevozhno-depressivnoe-rasstroystvo/case-1859/
# Возраст, диагноз F41.1 и перевод шкал случая (HAM-A 26, HDRS 18) в GAD-7 и PHQ-9 — команда.
# Врач команды подтвердил: Авиандр уместен в монотерапии, без антидепрессантов.
id: s6
title_ru: "ГТР у молодой женщины: когда назначить Авиандр"
status: validated
author_ru: "врач команды"
show_ru: "Назначение Авиандра без предшествующего лечения: противопоказаний в карточке нет, компас просит проверить у пациентки беременность и грудное вскармливание, органические заболевания мозга, ИМАО, почки и печень"
complaints_ru: "Два года нарастают плаксивость, частые головные боли и «тревога в груди» на фоне конфликтной семейной ситуации; замкнулась, ушла в себя"

patient:
  full_name: "Сценарий 6: женщина, 30 лет"
  email: scenario6@example.com
  sex: female
  age: 30

# Анамнез — пересказ случая probolezny.ru (case-1859) и complaints_ru, 27.10.
anamnesis:
  complaints: >-
    Постоянная «тревога в груди», которая без видимой причины то слабеет, то усиливается; при усилении —
    сердцебиение, жжение в груди и шее. Навязчивые мысли о своём здоровье, плаксивость, подавленность, апатия,
    снизилась работоспособность. Сон поверхностный: долго засыпает, утром не чувствует себя отдохнувшей.
  history: >-
    Симптомы нарастают около двух лет. Связывает их с семейной ситуацией: три года в браке, по настоянию мужа
    ушла с работы, живут с его родителями, которые постоянно её критикуют. Сначала много плакала и часто болела
    голова, позже появилась тревога в груди; замкнулась, ушла в себя. Лекарства не принимала, к специалистам
    не обращалась — пробовала справиться сама по роликам психологов.
  notes: >-
    Хронических заболеваний нет. ЭКГ, давление и пульс в норме; кардиолог и невролог патологии не нашли.
    Общий анализ крови и мочи в норме. Суицидальных мыслей нет.

diagnoses:
  - { icd10: "F41.1", title: "Генерализованное тревожное расстройство", source: exam,
      source_note: "первичный приём", diagnosed_ago: start }

# В случае — только общий анализ крови и мочи; биохимию подобрала команда 27.10.
# СКФ по CKD-EPI 2021 для женщины 30 лет при креатинине 70 — около 103.
labs:
  - { analyte: creatinine, value: 70, days_ago: 12, source_note: "поликлиника" }
  - { analyte: egfr, value: 103, days_ago: 12, source_note: "поликлиника" }
  - { analyte: alt, value: 16, days_ago: 12, source_note: "поликлиника" }
  - { analyte: ast, value: 19, days_ago: 12, source_note: "поликлиника" }
  - { analyte: bilirubin, value: 9, days_ago: 12, source_note: "поликлиника" }

# Две недели до визита — исходное состояние; на демо врач назначает Авиандр и видит пункты инструкции.
prescribe_aviandr: false
aviandr_dose_mg: 20                # инструкция ГРЛС: по 20 мг 2 раза в сутки
weeks:
  - week: 0
    anxiety: 7
    mood: 3
    sleep: 4
    gad7: 14                       # HAM-A 26; ниже 15 — правило «выраженная тревога» не предлагает психиатра
    phq9: 12                       # HDRS 18 — умеренные симптомы депрессии
    phq9_item9: 0
    messages: ["Сначала просто много плакала, часто болела голова, потом появилась какая-то тревога в груди"]
    expected_ru: "Исходное состояние: GAD-7 14 — умеренная тревога, PHQ-9 12, пункт 9 — 0; алертов нет"
  - week: 1
    anxiety: 7
    mood: 3
    sleep: 4
    expected_ru: >-
      Визит: врач назначает Авиандр по 20 мг 2 раза в сутки. Противопоказаний в карточке нет;
      «проверьте у пациентки»: беременность и грудное вскармливание, органические заболевания головного мозга
      (частые головные боли), ИМАО за 2 недели, почки (СКФ 103 из анализов), печень (билирубин из анализов).
      Врач отмечает каждый пункт и назначает

expected:
  referral_ru: "Не нужно: пациентку ведёт терапевт"
