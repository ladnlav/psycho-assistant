# Сценарий 5 — пациентка перестала вести записи. Пациент вымышленный.
# Клиническое содержание проверил врач команды.
id: s5
title_ru: "ГТР: пациентка перестала вести записи 6 дней назад"
status: validated
author_ru: "врач команды"
show_ru: "Три недели пациентка отмечает самочувствие и приём, потом 6 дней ничего не присылает: в приложении — напоминание, у врача — алерт «Нет записей пациента 5 дней: свяжитесь с пациентом»"
complaints_ru: "Тревога и напряжение после смены работы, трудности засыпания"

patient:
  full_name: "Сценарий 5: женщина, 29 лет"
  email: scenario5@example.com
  sex: female
  age: 29

# Анамнез — пересказ complaints_ru, команда, 27.10.
anamnesis:
  complaints: >-
    Тревога и напряжение, трудно засыпать.
  history: >-
    Тревога и напряжение появились после смены работы несколько месяцев назад: волнуется, что не справится,
    подолгу не может уснуть. Раньше за помощью не обращалась.

diagnoses:
  - { icd10: "F41.1", title: "Генерализованное тревожное расстройство", source: exam,
      source_note: "первичный приём", diagnosed_ago: start }

# Перед назначением; СКФ по CKD-EPI 2021 для женщины 29 лет при креатинине 64 — около 115.
labs:
  - { analyte: creatinine, value: 64, days_ago: 28, source_note: "поликлиника" }
  - { analyte: egfr, value: 115, days_ago: 28, source_note: "поликлиника" }
  - { analyte: alt, value: 15, days_ago: 28, source_note: "поликлиника" }
  - { analyte: ast, value: 18, days_ago: 28, source_note: "поликлиника" }
  - { analyte: bilirubin, value: 10, days_ago: 28, source_note: "поликлиника" }

prescribe_aviandr: true
aviandr_dose_mg: 20                # инструкция ГРЛС: по 20 мг 2 раза в сутки
last_report_days_ago: 6            # последняя запись — 6 дней назад, дальше пациентка молчит
weeks:
  - week: 0
    anxiety: 7
    mood: 4
    sleep: 4
    gad7: 13
    phq9: 8
    phq9_item9: 0
    intake_days: 7
    expected_ru: "Старт Авиандра. GAD-7 13 — умеренная тревога"
  - week: 1
    anxiety: 6
    mood: 5
    sleep: 5
    intake_days: 7
  - week: 2
    anxiety: 6
    mood: 5
    sleep: 5
    gad7: 11
    phq9: 7
    phq9_item9: 0
    intake_days: 7
    expected_ru: "GAD-7 11: минус 2 — меньше MCID, алертов нет. Последняя неделя с записями"

expected:
  reminder_ru: "С 3-го дня без записей пациентка видит в приложении напоминание заполнить дневник"
  alert_ru: "С 5-го дня врач видит алерт «Нет записей пациента 5 дней: свяжитесь с пациентом». При загрузке «низкой приверженности» нет: правила считаются на день последней записи"
  after_write_ru: "Когда пациентка снова что-то отметит, сработает и «низкая приверженность»: дни без отметки приёма считаются пропусками, а у пациентки уже висит напоминание о приёме"
  referral_ru: "Не сразу: врач связывается с пациенткой и решает, нужна ли консультация психиатра"
