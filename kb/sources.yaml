  url: https://www.nimh.nih.gov/research/research-conducted-at-nimh/asq-toolkit-materials
  verified: true
  note: "5 вопросов: 1–4 — скрининг; при любом «да» — вопрос 5 об остроте («прямо сейчас»). «Да» на 5 — острый положительный скрининг (немедленная оценка безопасности), «нет» на 5 — неострый положительный (краткая оценка безопасности). Бесплатно (страница NIMH); статус public domain на первоисточнике не найден"

