kr_gad:
  type: guideline
  title: "КР Минздрава «Генерализованное тревожное расстройство» (ID 457_3, 2024): §2.5 — GAD-7 для оценки уровня тревоги, §6 — организация помощи"
  url: https://cr.minzdrav.gov.ru/view-cr/457_3
  verified: true
  note: >-
    Рубрикатор КР, проверено 24.10: F41.1, взрослые, Российское общество психиатров, размещено 19.09.2024, действует,
    пересмотр не позднее 2026. §2.5: «Скрининговый опросник ГТР-7 (GAD-7) (Приложение Г2) для оценки уровня тревоги»,
    УУР B, УДД 3; §2.1: у всех пациентов оценить суицидальный риск, чтобы определить вид и объём психиатрической помощи;
    §6: показания к госпитализации, первое — выраженная тревога, требующая подбора терапии в стационаре.
    Приложение Г2 ссылается на адаптацию Золотарёвой, но текст в нём другой: все 7 пунктов, варианты ответа и названия
    уровней («5–9 — умеренный», «10–14 — средний»). В шкале — текст из статьи (zolotareva2023_gad7_ru).
    TODO(Савва): подтвердить разделы под правила.

kr_depression:
  type: guideline
  title: "КР Минздрава «Депрессивный эпизод, рекуррентное депрессивное расстройство» (ID 301_3, 2024): §2.1, §2.5 — оценка суицидального риска, §3 — стационар при суицидальных мыслях"
  url: https://cr.minzdrav.gov.ru/view-cr/301_3
  verified: true
  note: >-
    Рубрикатор КР, проверено 24.10: F32, F33, взрослые, Российское общество психиатров, размещено 26.08.2024, применяется.
    §2.1: приём врача-психиатра с оценкой риска суицидального поведения (УУР C, УДД 5); §2.5: обязательное выявление
    факторов риска суицида, первым — наличие суицидальных мыслей (УУР B, УДД 2); §3: при суицидальных мыслях рассмотреть
    стационарное лечение. PHQ-9 в КР не упоминается — порог берём из шкалы. TODO(Савва): подтвердить разделы под правила.

