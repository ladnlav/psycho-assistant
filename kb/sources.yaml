  type: paper
  title: "Kroenke K, Spitzer RL, Williams JBW. The Patient Health Questionnaire-2: validity of a two-item depression screener. Med Care. 2003;41(11):1284–1292."
  url: https://doi.org/10.1097/01.MLR.0000093487.78664.3C
  verified: true

kroenke2007_gad2:
  type: paper
  title: "Kroenke K, Spitzer RL, Williams JBW, Monahan PO, Löwe B. Anxiety disorders in primary care: prevalence, impairment, comorbidity, and detection. Ann Intern Med. 2007;146(5):317–325."
  url: https://doi.org/10.7326/0003-4819-146-5-200703060-00004
  verified: true
  note: "Первоисточник GAD-2"

kroenke2009_phq4:
  type: paper
  title: "Kroenke K, Spitzer RL, Williams JBW, Löwe B. An ultra-brief screening scale for anxiety and depression: the PHQ-4. Psychosomatics. 2009;50(6):613–621."
  url: https://doi.org/10.1176/appi.psy.50.6.613
  verified: true
  note: >-
    2149 пациентов терапевтов, два фактора (депрессия и тревога), 84% дисперсии; рост суммы связан с нарушением
    функционирования (по аннотации, полный текст закрыт). Подшкалы ≥ 3 — положительный скрининг, сумма 0–2 / 3–5 /
    6–8 / 9–12 — нет / лёгкий / умеренный / выраженный дистресс: по бланку PHQ-4 и вторичным источникам, со ссылкой
    на эту статью; порог подшкал ≥ 3 есть и в zolotareva2024_phq4_ru. Проверено 27.10.

lowe2010_phq4:
  type: paper
  title: "Löwe B, Wahl I, Rose M, Spitzer C, Glaesmer H, Wingenfeld K, Schneider A, Brähler E. A 4-item measure of depression and anxiety: validation and standardization of the Patient Health Questionnaire-4 (PHQ-4) in the general population. J Affect Disord. 2010;122(1-2):86–95."
  url: https://doi.org/10.1016/j.jad.2009.06.019
  verified: true
  note: >-
    Общая популяция Германии, n=5030, двухфакторная структура, нормы (перцентили). PHQ-2 и GAD-2 = 3 — 93,4-й и
    95,2-й перцентили (по аннотации, полный текст закрыт). Уровней суммы в аннотации нет; по вторичному источнику
    (SRA Lab) сумма ≥ 6 — 95,7-й перцентиль, «жёлтый флаг», ≥ 9 — 99,1-й, «красный». Проверено 27.10.

zolotareva2024_phq4_ru:
  type: paper
  title: "Золотарева А.А., Костенко В.Ю., Лебедева А.А., Чумакова М.А. Скрининг тревоги и депрессии в общей популяции: адаптация Patient Health Questionnaire-4 в России. Обозрение психиатрии и медицинской психологии им. В.М. Бехтерева. 2024;58(2):45–54."
  url: https://doi.org/10.31363/2313-7053-2024-899
  verified: true
  note: >-
    Полный текст прочитан 27.10. Текст PHQ-4 — в приложении (с. 54): перевод из статей о GAD-7 и PHQ-9, пункты
    1–2 — тревога, 3–4 — депрессия, «клинически значимыми при ≥ 3». Общая популяция, 2000 человек 18–60 лет,
    двухфакторная структура, Спирмен–Браун 0,82 (тревога) и 0,81 (депрессия). Критериальная валидность — по
    обращению за помощью; чувствительность и специфичность против диагноза не изучались. Статья CC BY-NC-SA 4.0
    (страница журнала)

