id: low_adherence
title_ru: "Низкая приверженность: приём < 80% дней за неделю"
level: medium
status: draft
# pdc_7d = доля завершённых дней из последних 7 с отметкой «принял»; None — нет назначения или < 3 дней.
when: "pdc_7d < 0.8"
actions: [notify_doctor, remind_patient]
remind_ru: "За неделю приём препарата отмечен не каждый день. Если пропускаете приём или с лечением есть сложности — напишите врачу."
sources: [grls_aviandr, team_adherence_80]   # порог 80 % — врач команды, 27.10
