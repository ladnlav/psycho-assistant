id: patient_help_request
title_ru: "Пациент просит срочной помощи: причина — в чате"
level: critical
status: validated        # уровень «критично» подтверждён командой 27.10
# Кнопка «Нужна срочная помощь»: экран 112 и 103 пациент видит сразу, а когда напишет, что случилось,
# причина уходит врачу сообщением в чат и этим алертом. Если в причине есть слова о смерти или
# самоповреждении, дополнительно срабатывает free_text_risk с предложением «обязательно».
when: "help.requests_24h > 0"
actions: [notify_doctor]
sources: [team_help_request]
