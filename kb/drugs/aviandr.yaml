# Заполняется ТОЛЬКО по инструкции из ГРЛС (владелец — Савва). Ничего не додумывать.
# 21.10: паспорт и противопоказания перенесены из таблицы Саввы (листы «Авиандр — паспорт» и «— инструкция»).
# 23.10: коды МКБ подтвердил Савва на созвоне (кроме органических заболеваний мозга), Z39.1 убран, порог «пожилого» — 60.
# 24.10: список ИМАО и коды противопоказаний от Саввы; что проверить у пациента (check_ru) — тоже его.
# 24.10: регистрация ИМАО в РФ и их торговые названия — по ГРЛС (grls.minzdrav.gov.ru).
# 24.10: показания, «с осторожностью», взаимодействия, дозировка и нежелательные реакции — из листка-вкладыша
#   в ГРЛС (ЛП-№(002445)-(РГ-RU), изменение от 16.07.2026; PDF — materials/01-кейс). Противопоказания листка
#   совпадают с таблицей Саввы по смыслу. Врачебная ОХЛП в ГРЛС не опубликована.
# TODO(Савва): сверить перенос с листком-вкладышем (S8).
id: aviandr
trade_name: "Авиандр"
inn: "маритупирдин"
registered_rf: true
status: draft
atc: "N05BX"                     # паспорт ГРЛС (таблица Саввы)

dosage_forms:
  - "таблетки, покрытые плёночной оболочкой, 20 мг"   # ГРЛС: блистер по 10 (3 в пачке) или флакон по 30

indications:                     # ГРЛС: «у взрослых старше 18 лет»
  - icd10: "F41.1"
    text: "Генерализованное тревожное расстройство"
  - icd10: null                  # TODO(Савва): коды МКБ (в листке-вкладыше их нет)
    text: "Тревожные состояния после перенесённой коронавирусной инфекции (COVID-19) у пациентов со стрессовой реакцией и нарушением адаптации, лёгкой и средней степени выраженности"

# Пункты, которые врач видит при назначении (формат — kb/README.md, «Препараты»):
# text_ru — дословно из ГРЛС; when — условие по карточке; ask — спросить, если в карточке ничего нет.
contraindications:
  - id: hypersensitivity
    text_ru: "Повышенная чувствительность к маритупирдину"
  - id: epilepsy-organic-brain   # в таблице две строки с одной и той же формулировкой — здесь один пункт
    text_ru: "эпилепсия и органические заболевания головного мозга"
    when: "dx('G40')"            # эпилепсия — G40 (Савва, 24.10). TODO(Савва): коды органических заболеваний мозга
    ask: true
  - id: maoi
    text_ru: "прием одновременно с ингибиторами МАО и в течение 2 недель после их отмены"
    # Список ИМАО — от Саввы 24.10: сафинамид — дополнительный препарат при болезни Паркинсона; фуразолидон,
    # линезолид — антибиотики с активностью МАО; метиленовый синий.
    # Регистрация в РФ проверена по ГРЛС 24.10 (записи во всех состояниях):
    #   действуют: разагилин (Азилект, Разагилин Медисорб), пирлиндол (Пиразидол, ЛП-№(001788)-(РГ-RU)
    #     от 08.02.2023), сафинамид (Ксадаго), линезолид, фуразолидон, метиленовый синий (МНН «метилтиониния хлорид»);
    #   исключены: моклобемид (Аурорикс, 2015), селегилин (Юмекс, 2023);
    #   не регистрировались: транилципромин, фенелзин, изокарбоксазид, толоксатон, ниаламид, ипрониазид, ипроклозид.
    # Незарегистрированные оставлены: карточка может их содержать (приём из-за рубежа, старые записи).
    # Сравнение — по подстроке в названии назначения, поэтому к МНН добавлены торговые названия действующих
    # в РФ препаратов из ГРЛС (названия «Линезолид …», «Фуразолидон …» ловятся по МНН).
    when: >-
      taking('моклобемид', 'пирлиндол', 'селегилин', 'разагилин', 'транилципромин', 'ипрониазид',
      'фенелзин', 'изокарбоксазид', 'ипроклозид', 'ниаламид', 'толоксатон', 'сафинамид',
      'фуразолидон', 'линезолид', 'метиленовый синий', 'метилтиониния',
      'пиразидол', 'азилект', 'ксадаго',
      'зивокс', 'зиваксилид', 'лайнез', 'селезолид', 'зеникс', 'амизолид', 'линеген', 'линоджект', 'бактолин')
    ask: true                    # отменённые за 2 недели карточка не видит — спрашиваем всегда
  - id: renal-failure
    text_ru: "почечная недостаточность средней и тяжелой степени (СКФ< 60 мл/мин)"
    when: "dx('N18.3', 'N18.4', 'N18.5')"   # хроническая болезнь почек (Савва); СКФ в карточке нет — поэтому ask
    ask: true
    check_ru: "креатинин крови, СКФ"
  - id: hepatic-failure
    text_ru: "печеночная недостаточность легкой, средней и тяжелой степени (класс А, В и С по классификации Чайлд-Пью)"
    # Код хронического гепатита в карточке не исключает печёночную недостаточность — её оценивают лабораторно
    # и клинически (Савва, 24.10).
    when: "dx('K72', 'K70.4')"
    ask: true
    check_ru: "общий билирубин (мкмоль/л), альбумин (г/л), МНО; асцит — клинически или по УЗИ; печёночная энцефалопатия — тест связи чисел"
  - id: under-18
    text_ru: "дети и подростки в возрасте до 18 лет."
    when: "age < 18"
  - id: pregnancy-lactation
    text_ru: "Противопоказано применение при беременности и в период грудного вскармливания."
    when: "dx('Z33', 'Z34')"     # беременность — Z33, Z34 (Савва, 24.10)
    ask: "sex == 'female'"

# «С осторожностью» — из листка-вкладыша ГРЛС. Пункты срабатывают по диагнозам в карточке и без них не показываются.
# TODO(Савва): подтвердить коды МКБ под формулировки листка.
caution:
  - id: cardiovascular
    text_ru: "Сердечно-сосудистое заболевание"
    when: "dx('I')"              # класс IX МКБ-10 «Болезни системы кровообращения»
  - id: endocrine
    text_ru: "Сахарный диабет или другие эндокринные заболевания"
    when: "dx('E0', 'E1', 'E2', 'E3')"   # E00–E35: эндокринные болезни без расстройств питания и обмена (E40–E90)
  - id: substance-dependence
    text_ru: "Алкогольная или наркотическая зависимость"
    when: "dx('F10', 'F11', 'F12', 'F13', 'F14', 'F15', 'F16', 'F18', 'F19')"   # F1x без F17 (табак)
  - id: elderly                  # в листке-вкладыше 2026 этого пункта нет; источник — таблица Саввы. TODO(Савва): откуда
    text_ru: "Пациенты пожилого возраста обычно более чувствительны, особенно в отношении побочных эффектов."
    when: "age >= 60"            # порог «пожилого» — 60 лет по классификации ВОЗ (Савва, 23.10)

# Взаимодействия — из листка-вкладыша ГРЛС: «Обязательно сообщите врачу, если Вы принимаете…». Препараты в taking() —
# примеры из листка («и др.»), ИМАО — в противопоказаниях (пункт maoi). TODO(Савва): дополнить классы препаратами,
# которые встречаются в карточках (например, феназепам).
interactions:
  - id: anxiolytics
    text_ru: "Противотревожные препараты (диазепам, алпразолам, алимемазин, гидроксизин и др.)"
    when: "taking('диазепам', 'алпразолам', 'алимемазин', 'гидроксизин')"
    severity: caution
  - id: antipsychotics
    text_ru: "Нейролептики (кветиапин, рисперидон, галоперидол и др.)"
    when: "taking('кветиапин', 'рисперидон', 'галоперидол')"
    severity: caution
  - id: hypnotics
    text_ru: "Снотворные препараты (зопиклон, золпидем, фенобарбитал, доксиламин и др.)"
    when: "taking('зопиклон', 'золпидем', 'фенобарбитал', 'доксиламин')"
    severity: caution
  - id: antihistamines
    text_ru: "Противоаллергические препараты (хлоропирамин, клемастин, цетиризин и др.)"
    when: "taking('хлоропирамин', 'клемастин', 'цетиризин')"
    severity: caution
  - id: serotonergic
    text_ru: "Антидепрессанты и другие препараты, влияющие на обмен серотонина (сертралин, пароксетин, амитриптилин, препараты лития, зверобой продырявленный, L-триптофан и др.)"
    when: "taking('сертралин', 'пароксетин', 'амитриптилин', 'лития', 'зверобой', 'триптофан')"
    severity: caution
  - id: triptans
    text_ru: "Триптаны (суматриптан, золмитриптан и др.)"
    when: "taking('суматриптан', 'золмитриптан')"
    severity: caution
  - id: opioids
    text_ru: "Опиоидные анальгетики (трамадол, фентанил и др.)"
    when: "taking('трамадол', 'фентанил')"
    severity: caution
  - id: cyp2d6-inhibitors
    text_ru: "Ингибиторы фермента CYP2D6 (флуоксетин, пароксетин, дифенгидрамин, тербинафин, хинидин, гидроксихлорохин и др.)"
    when: "taking('флуоксетин', 'пароксетин', 'дифенгидрамин', 'тербинафин', 'хинидин', 'гидроксихлорохин')"
    severity: caution

# Дозировка — листок-вкладыш ГРЛС, раздел 3.
dosing:
  single_mg: 20
  times_per_day: 2
  daily_mg: 40
  schedule_ru: "по 1 таблетке (20 мг) 2 раза в сутки, утром и вечером; внутрь за 30 минут до еды, не разжёвывая"
  duration_ru:
    gad: "определяет врач: генерализованное тревожное расстройство течёт хронически"
    post_covid_anxiety: "4 недели, при необходимости по рекомендации врача — до 6 недель"
  missed_dose_ru: "двойную дозу не принимать — следующую дозу в обычное время"
  alcohol_ru: "в период лечения воздерживаться от алкоголя"
  driving_ru: "возможны головокружение и сонливость — при их появлении не управлять транспортом"
  excipients_ru: "содержит лактозу"

# Нежелательные реакции — листок-вкладыш ГРЛС, раздел 4. report_now — «немедленно сообщите лечащему врачу».
adverse_events:
  - { term: "скованность мышц тела", frequency: "нечасто", report_now: true }
  - { term: "напряжение жевательных мышц (тризм)", frequency: "нечасто", report_now: true }
  - { term: "повышенная потливость (гипергидроз)", frequency: "нечасто", report_now: true }
  - { term: "снижение уровня гемоглобина в крови", frequency: "нечасто", report_now: true }
  - { term: "сонливость", frequency: "часто" }
  - { term: "головная боль", frequency: "часто" }
  - { term: "головокружение", frequency: "часто" }
  - { term: "общая слабость (астения)", frequency: "часто" }
  - { term: "покалывание или онемение в конечностях (парестезии)", frequency: "часто" }
  - { term: "бессонница (инсомния)", frequency: "нечасто" }
  - { term: "низкое качество сна", frequency: "нечасто" }
  - { term: "усиление тревоги", frequency: "нечасто" }
  - { term: "нарушение внимания", frequency: "нечасто" }
  - { term: "сниженная реакция на раздражители", frequency: "нечасто" }
  - { term: "нарушение вкуса (дисгевзия)", frequency: "нечасто" }
  - { term: "тошнота", frequency: "нечасто" }
  - { term: "боль в верхней части живота", frequency: "нечасто" }
  - { term: "запор", frequency: "нечасто" }
  - { term: "боль в спине", frequency: "нечасто" }
  - { term: "повышение уровня креатинфосфокиназы в крови", frequency: "нечасто" }

sources: [grls_aviandr, sponsor_deck_aviandr]
