# Авиандр — только по листку-вкладышу из ГРЛС (ЛП-№(002445)-(РГ-RU), изменение от 16.07.2026); ничего не додумывается.
# Врачебная инструкция (ОХЛП) в ГРЛС не опубликована. Перенос сверен с листком по всем разделам 27.10.2026.
# Коды МКБ-10 в условиях when, списки препаратов и что проверить у пациента (check_ru) выбрал врач команды;
# регистрация ИМАО в РФ и их торговые названия проверены по ГРЛС (grls.minzdrav.gov.ru).
# Почки — по коду ХБП в карточке или по СКФ из анализов (lab('egfr') < 60, порог из текста инструкции); печень —
#   врач видит билирубин, альбумин и МНО из карточки, класс по Чайлд-Пью система не вычисляет.
id: aviandr
trade_name: "Авиандр"
inn: "маритупирдин"
registered_rf: true
status: draft
atc: "N05BX"                     # паспорт ГРЛС

dosage_forms:
  - "таблетки, покрытые плёночной оболочкой, 20 мг"   # ГРЛС: блистер по 10 (3 в пачке) или флакон по 30

indications:                     # ГРЛС: «у взрослых старше 18 лет»; text — слова листка в именительном падеже
  - icd10: "F41.1"
    text: "Генерализованное тревожное расстройство"
  # Кодов в листке нет. Врач команды: F41.1 вместе с U09.9 (состояние после COVID-19). В обычном диагнозе это
  # «F41.1 ГТР, подтверждённый», а состояние после COVID-19 — в развёрнутом клиническом диагнозе.
  - icd10: ["F41.1", "U09.9"]    # оба кода вместе
    text: "Тревожные состояния после перенесённой коронавирусной инфекции (COVID-19) у пациентов со стрессовой реакцией и нарушением адаптации, лёгкой и средней степени выраженности"

# Пункты, которые врач видит при назначении (формат — kb/README.md, «Препараты»):
# text_ru — дословная выдержка из листка-вкладыша ГРЛС без обращения к пациенту в начале фразы («Если у Вас»,
# «Не принимайте АВИАНДР®, если Вы … принимаете»); заглавную букву ставит интерфейс. Исключение отмечено у пункта.
# when — условие по карточке; ask — спросить, если в карточке ничего нет.
contraindications:
  - id: hypersensitivity
    text_ru: "аллергия на действующее вещество (маритупирдин) или любые другие компоненты препарата (перечисленные в разделе 6 листка-вкладыша)"
    # Раздел 6 листка: лактозы моногидрат, касторовое масло гидрогенизированное, крахмал картофельный, гипромеллоза,
    # титана диоксид (Е171), полиэтиленгликоль (Е1521).
  - id: epilepsy-organic-brain   # в листке — один пункт
    text_ru: "при эпилепсии или органических поражениях головного мозга"
    # Эпилепсия — G40. Органические поражения мозга — коды врача команды: I60–I69, S06, F07.2,
    # G00–G10, G30, G93.1, G92, G93.4, C71, D33, Q00–Q04, F00–F09. dx() сравнивает по префиксу: 'I6' — I60–I69,
    # 'F0' — F00–F09 вместе с F07.2, 'G0' — G00–G09; Q00–Q04 по одному, потому что 'Q0' захватил бы Q05–Q07.
    # S06.0 (сотрясение) не берём: это функциональное нарушение без структурных изменений мозга (MSD Manuals,
    # «Сотрясение мозга»), решение команды. Постконтузионный синдром — F07.2, входит в 'F0'.
    when: "dx('G40', 'I6', 'S06.1', 'S06.2', 'S06.3', 'S06.4', 'S06.5', 'S06.6', 'S06.7', 'S06.8', 'S06.9', 'F0', 'G0', 'G10', 'G30', 'G92', 'G93.1', 'G93.4', 'C71', 'D33', 'Q00', 'Q01', 'Q02', 'Q03', 'Q04')"
    ask: true
  - id: maoi
    text_ru: "лекарственные препараты называемые ингибиторами моноаминоксидазы (например, моклобемид, фенелзин, транилципромин, разагилин и др.) или в течение 2 недель после прекращения лечения ингибитором моноаминоксидазы"
    # Выдержка из подраздела «Другие препараты и препарат АВИАНДР®», который ссылается на «Противопоказания». Пункт
    # «Противопоказания» уже: «антидепрессанты из группы ингибиторов моноаминоксидазы (МАО) и в течение 2 недель после
    # их отмены». Список ниже шире антидепрессантов (разагилин, сафинамид, антибиотики), как и подраздел о препаратах.
    # Врач команды: весь список — противопоказание, а не «с осторожностью».
    # Список ИМАО — врач команды: сафинамид — дополнительный препарат при болезни Паркинсона; фуразолидон,
    # линезолид — антибиотики с активностью МАО; метиленовый синий.
    # Регистрация в РФ проверена по ГРЛС 24.10.2026 (записи во всех состояниях):
    #   действуют: разагилин (Азилект, Разагилин Медисорб), пирлиндол (Пиразидол, ЛП-№(001788)-(РГ-RU)
    #     от 08.02.2023), сафинамид (Ксадаго), линезолид, фуразолидон, метиленовый синий (МНН «метилтиониния хлорид»);
    #   исключены: моклобемид (Аурорикс, 2015), селегилин (Юмекс, 2023);
    #   не регистрировались: транилципромин, фенелзин, изокарбоксазид, толоксатон, ниаламид, ипрониазид, ипроклозид.
    # Незарегистрированные оставлены: карточка может их содержать (приём из-за рубежа, старые записи).
    # Сравнение — по подстроке в названии назначения, поэтому к МНН добавлены торговые названия действующих
    # в РФ препаратов из ГРЛС (названия «Линезолид …», «Фуразолидон …» ловятся по МНН).
    when: >-
      taking('моклобемид', 'пирлиндол', 'селегилин', 'разагилин', 'транилципромин', 'ипрониазид',
      'фенелзин', 'изокарбоксазид', 'ипроклозид', 'ниаламид', 'толоксатон', 'сафинамид',
      'фуразолидон', 'линезолид', 'метиленовый синий', 'метилтиониния',
      'пиразидол', 'азилект', 'ксадаго',
      'зивокс', 'зиваксилид', 'лайнез', 'селезолид', 'зеникс', 'амизолид', 'линеген', 'линоджект', 'бактолин')
    ask: true                    # отменённые за 2 недели карточка не видит — спрашиваем всегда
  - id: renal-failure
    text_ru: "почечная недостаточность средней и тяжелой степени (СКФ <60 мл/мин)"
    # Найдено в карточке: код ХБП или последняя СКФ из раздела «Лабораторные исследования» ниже 60 — порог
    # из текста инструкции. Нет анализа — lab() не срабатывает, и пункт остаётся «проверьте у пациента» (ask).
    when: "dx('N18.3', 'N18.4', 'N18.5') or lab('egfr') < 60"
    ask: true
    labs: [creatinine]           # СКФ показывается из when
    check_ru: "креатинин крови, СКФ"
  - id: hepatic-failure
    text_ru: "печеночная недостаточность легкой, средней и тяжелой степени (класс А, В и С по классификации Чайлд-Пью)"
    # Код хронического гепатита в карточке не исключает печёночную недостаточность — её оценивают лабораторно
    # и клинически (врач команды). K71.1 и вирусные гепатиты с печёночной комой не добавляем: только K72 и K70.4,
    # остальное врач оценивает сам — пункт и так показывается всем как «проверьте у пациента».
    when: "dx('K72', 'K70.4')"
    ask: true
    labs: [bilirubin, albumin, inr]   # врач видит анализы из карточки; класс по Чайлд-Пью система не вычисляет
    check_ru: "общий билирубин (мкмоль/л), альбумин (г/л), МНО; асцит — клинически или по УЗИ; печёночная энцефалопатия — тест связи чисел"
  - id: under-18
    # Исключение из дословности: в листке «Не давайте препарат детям в возрасте от 0 до 18 лет…» — обращение
    # к пациенту убрано, «детям» — в именительном падеже, остальные слова листка.
    text_ru: "дети в возрасте от 0 до 18 лет — в связи с отсутствием данных по эффективности и безопасности препарата у данной категории"
    # В листке — подраздел «Дети и подростки», а не список противопоказаний; показания — «у взрослых старше 18 лет».
    # Врач команды: противопоказание.
    when: "age < 18"
  - id: pregnancy-lactation
    # Подразделы листка «Беременность» и «Грудное вскармливание». Исключение из дословности: убраны обращения к
    # пациентке («Не принимайте препарат АВИАНДР®», «он», «Вы»), остальные слова листка. Вводная фраза «Беременность
    # и грудное вскармливание» (посоветоваться с врачом до начала приёма) обращена к пациентке и не перенесена.
    # Врач команды: противопоказаны и беременность, и грудное вскармливание — один пункт, не «с осторожностью».
    text_ru: "противопоказан при беременности; возможен потенциальный риск для плода в случае, если препарат АВИАНДР® принимали во время первого триместра беременности или беременность наступила во время применения препарата. При необходимости применения препарата в период грудного вскармливания (лактации), грудное вскармливание следует прекратить"
    # Z33, Z34 — беременность; Z35 (наблюдение при беременности высокого риска), Z36 (антенатальный скрининг) и
    # класс O (беременность, роды и послеродовой период, в т.ч. лактация) — врач команды.
    when: "dx('Z33', 'Z34', 'Z35', 'Z36', 'O')"
    ask: "sex == 'female'"

# «С осторожностью» — из листка-вкладыша ГРЛС. Пункты срабатывают по диагнозам в карточке и без них не показываются.
# Коды сверены со структурой МКБ-10 27.10: I — класс IX «Болезни системы кровообращения», E00–E35 — эндокринные
# болезни (без расстройств питания и обмена), F10–F19 без F17 — психоактивные вещества, кроме табака.
caution:
  - id: cardiovascular
    text_ru: "Сердечно-сосудистое заболевание"
    when: "dx('I')"              # класс IX МКБ-10 «Болезни системы кровообращения»
  - id: endocrine
    text_ru: "Сахарный диабет или другие эндокринные заболевания"
    when: "dx('E0', 'E1', 'E2', 'E3')"   # E00–E35: эндокринные болезни без расстройств питания и обмена (E40–E90)
  - id: substance-dependence
    # Исключение из дословности: в листке «Если Вы страдаете алкогольной или наркотической зависимостью» — те же
    # слова в именительном падеже.
    text_ru: "Алкогольная или наркотическая зависимость"
    when: "dx('F10', 'F11', 'F12', 'F13', 'F14', 'F15', 'F16', 'F18', 'F19')"   # F1x без F17 (табак)
# Пункта о пожилом возрасте в листке нет, поэтому его нет и здесь.

# Взаимодействия — из листка-вкладыша ГРЛС: «Обязательно сообщите врачу, если Вы принимаете…». Препараты в taking() —
# примеры из листка («и др.»), ИМАО — в противопоказаниях (пункт maoi). Противотревожные дополнены частыми в РФ средствами; остальные классы — по мере появления в карточках.
interactions:
  - id: anxiolytics
    text_ru: "Противотревожные препараты (диазепам, алпразолам, алимемазин, гидроксизин и др.)"
    # Кроме примеров листка — противотревожные средства, которые часто встречаются в карточках в РФ (справочник Видаль):
    # феназепам (и Фензитат), гидазепам, тофизопам (Грандаксин), фабомотизол (Афобазол), этифоксин (Стрезам), буспирон.
    when: >-
      taking('диазепам', 'алпразолам', 'алимемазин', 'гидроксизин', 'феназепам', 'фензитат', 'гидазепам',
      'тофизопам', 'грандаксин', 'фабомотизол', 'афобазол', 'этифоксин', 'стрезам', 'буспирон', 'спитомин')
    severity: caution
  - id: antipsychotics
    text_ru: "Нейролептики (кветиапин, рисперидон, галоперидол и др.)"
    when: "taking('кветиапин', 'рисперидон', 'галоперидол')"
    severity: caution
  - id: hypnotics
    text_ru: "Снотворные препараты (зопиклон, золпидем, фенобарбитал, доксиламин и др.)"
    when: "taking('зопиклон', 'золпидем', 'фенобарбитал', 'доксиламин')"
    severity: caution
  - id: antihistamines
    text_ru: "Противоаллергические препараты (хлоропирамин, клемастин, цетиризин и др.)"
    when: "taking('хлоропирамин', 'клемастин', 'цетиризин')"
    severity: caution
  - id: serotonergic
    text_ru: "Антидепрессанты и другие препараты, влияющие на обмен серотонина (сертралин, пароксетин, амитриптилин, препараты лития, Зверобой продырявленный, L-триптофан и др.)"
    when: "taking('сертралин', 'пароксетин', 'амитриптилин', 'лития', 'зверобой', 'триптофан')"
    severity: caution
  - id: triptans
    text_ru: "Триптаны (суматриптан, золмитриптан и др.)"
    when: "taking('суматриптан', 'золмитриптан')"
    severity: caution
  - id: opioids
    text_ru: "Опиоидные анальгетики (трамадол, фентанил и др.)"
    when: "taking('трамадол', 'фентанил')"
    severity: caution
  - id: cyp2d6-inhibitors
    text_ru: "Препараты, которые являются ингибиторами фермента CYP2D6 (флуоксетин, пароксетин, дифенгидрамин, тербинафин, хинидин, гидроксихлорохин и др.)"
    when: "taking('флуоксетин', 'пароксетин', 'дифенгидрамин', 'тербинафин', 'хинидин', 'гидроксихлорохин')"
    severity: caution

# Дозировка — листок-вкладыш ГРЛС, раздел 3; алкоголь, транспорт и лактоза — раздел 2. Строки *_ru — пересказ
# листка, а не цитата; врачу показывается только schedule_ru («По инструкции (ГРЛС)»).
dosing:
  single_mg: 20
  times_per_day: 2
  daily_mg: 40
  schedule_ru: "по 1 таблетке (20 мг) 2 раза в сутки, утром и вечером; внутрь за 30 минут до еды, не разжёвывая"
  duration_ru:
    gad: "определяет врач: генерализованное тревожное расстройство течёт хронически"
    post_covid_anxiety: "4 недели, при необходимости по рекомендации врача — до 6 недель"
  missed_dose_ru: "двойную дозу не принимать — следующую дозу в обычное время"
  alcohol_ru: "в период лечения воздерживаться от алкоголя"
  driving_ru: "возможны головокружение и сонливость — при их появлении воздержаться от управления транспортными средствами и работы с механизмами"
  excipients_ru: "содержит лактозу: при непереносимости некоторых сахаров — обратиться к врачу до приёма"

# Нежелательные реакции — листок-вкладыш ГРЛС, раздел 4. report_now — «немедленно сообщите лечащему врачу».
adverse_events:
  - { term: "скованность мышц тела", frequency: "нечасто", report_now: true }
  - { term: "напряжение жевательных мышц (тризм)", frequency: "нечасто", report_now: true }
  - { term: "повышенная потливость (гипергидроз)", frequency: "нечасто", report_now: true }
  - { term: "снижение уровня гемоглобина в крови", frequency: "нечасто", report_now: true }
  - { term: "сонливость", frequency: "часто" }
  - { term: "головная боль", frequency: "часто" }
  - { term: "головокружение", frequency: "часто" }
  - { term: "общая слабость (астения)", frequency: "часто" }
  - { term: "покалывание или онемение в конечностях (парестезии)", frequency: "часто" }
  - { term: "бессонница (инсомния)", frequency: "нечасто" }
  - { term: "низкое качество сна", frequency: "нечасто" }
  - { term: "усиление тревоги", frequency: "нечасто" }
  - { term: "нарушение внимания", frequency: "нечасто" }
  - { term: "сниженная реакция на раздражители", frequency: "нечасто" }
  - { term: "нарушение вкуса (дисгевзия)", frequency: "нечасто" }
  - { term: "тошнота", frequency: "нечасто" }
  - { term: "боль в верхней части живота", frequency: "нечасто" }
  - { term: "запор", frequency: "нечасто" }
  - { term: "боль со стороны спины", frequency: "нечасто" }
  - { term: "повышение уровня креатинфосфокиназы в крови", frequency: "нечасто" }

sources: [grls_aviandr, sponsor_deck_aviandr]
