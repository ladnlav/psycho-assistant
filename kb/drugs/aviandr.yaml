# Заполняется ТОЛЬКО по инструкции из ГРЛС (владелец — Савва). Ничего не додумывать.
# 21.10: паспорт и противопоказания перенесены из таблицы Саввы (листы «Авиандр — паспорт» и «— инструкция»).
# 23.10: коды МКБ подтвердил Савва на созвоне (кроме органических заболеваний мозга), Z39.1 убран, порог «пожилого» — 60.
# 24.10: список ИМАО и коды противопоказаний от Саввы; что проверить у пациента (check_ru) — тоже его.
# 24.10: регистрация ИМАО в РФ и их торговые названия — по ГРЛС (grls.minzdrav.gov.ru).
# TODO(Савва): сверить формулировки дословно с PDF инструкции.
id: aviandr
trade_name: "Авиандр"
inn: "маритупирдин"
registered_rf: true
status: draft
atc: "N05BX"                     # паспорт ГРЛС (таблица Саввы)

dosage_forms:
  - "таблетки, 20 мг"            # Савва: по 30 таблеток; «плёночная оболочка» (упаковка на слайде спонсора) — сверить по PDF

indications: []          # TODO: [{icd10: "F41.1", text: "..."}]

# Пункты, которые врач видит при назначении (формат — kb/README.md, «Препараты»):
# text_ru — дословно из ГРЛС; when — условие по карточке; ask — спросить, если в карточке ничего нет.
contraindications:
  - id: hypersensitivity
    text_ru: "Повышенная чувствительность к маритупирдину"
  - id: epilepsy-organic-brain   # в таблице две строки с одной и той же формулировкой — здесь один пункт
    text_ru: "эпилепсия и органические заболевания головного мозга"
    when: "dx('G40')"            # эпилепсия — G40 (Савва, 24.10). TODO(Савва): коды органических заболеваний мозга
    ask: true
  - id: maoi
    text_ru: "прием одновременно с ингибиторами МАО и в течение 2 недель после их отмены"
    # Список ИМАО — от Саввы 24.10: сафинамид — дополнительный препарат при болезни Паркинсона; фуразолидон,
    # линезолид — антибиотики с активностью МАО; метиленовый синий.
    # Регистрация в РФ проверена по ГРЛС 24.10 (записи во всех состояниях):
    #   действуют: разагилин (Азилект, Разагилин Медисорб), пирлиндол (Пиразидол, ЛП-№(001788)-(РГ-RU)
    #     от 08.02.2023), сафинамид (Ксадаго), линезолид, фуразолидон, метиленовый синий (МНН «метилтиониния хлорид»);
    #   исключены: моклобемид (Аурорикс, 2015), селегилин (Юмекс, 2023);
    #   не регистрировались: транилципромин, фенелзин, изокарбоксазид, толоксатон, ниаламид, ипрониазид, ипроклозид.
    # Незарегистрированные оставлены: карточка может их содержать (приём из-за рубежа, старые записи).
    # Сравнение — по подстроке в названии назначения, поэтому к МНН добавлены торговые названия действующих
    # в РФ препаратов из ГРЛС (названия «Линезолид …», «Фуразолидон …» ловятся по МНН).
    when: >-
      taking('моклобемид', 'пирлиндол', 'селегилин', 'разагилин', 'транилципромин', 'ипрониазид',
      'фенелзин', 'изокарбоксазид', 'ипроклозид', 'ниаламид', 'толоксатон', 'сафинамид',
      'фуразолидон', 'линезолид', 'метиленовый синий', 'метилтиониния',
      'пиразидол', 'азилект', 'ксадаго',
      'зивокс', 'зиваксилид', 'лайнез', 'селезолид', 'зеникс', 'амизолид', 'линеген', 'линоджект', 'бактолин')
    ask: true                    # отменённые за 2 недели карточка не видит — спрашиваем всегда
  - id: renal-failure
    text_ru: "почечная недостаточность средней и тяжелой степени (СКФ< 60 мл/мин)"
    when: "dx('N18.3', 'N18.4', 'N18.5')"   # хроническая болезнь почек (Савва); СКФ в карточке нет — поэтому ask
    ask: true
    check_ru: "креатинин крови, СКФ"
  - id: hepatic-failure
    text_ru: "печеночная недостаточность легкой, средней и тяжелой степени (класс А, В и С по классификации Чайлд-Пью)"
    # Код хронического гепатита в карточке не исключает печёночную недостаточность — её оценивают лабораторно
    # и клинически (Савва, 24.10).
    when: "dx('K72', 'K70.4')"
    ask: true
    check_ru: "общий билирубин (мкмоль/л), альбумин (г/л), МНО; асцит — клинически или по УЗИ; печёночная энцефалопатия — тест связи чисел"
  - id: under-18
    text_ru: "дети и подростки в возрасте до 18 лет."
    when: "age < 18"
  - id: pregnancy-lactation
    text_ru: "Противопоказано применение при беременности и в период грудного вскармливания."
    when: "dx('Z33', 'Z34')"     # беременность — Z33, Z34 (Савва, 24.10)
    ask: "sex == 'female'"

caution:
  - id: elderly                  # TODO(Савва): раздел инструкции (в таблице не указан)
    text_ru: "Пациенты пожилого возраста обычно более чувствительны, особенно в отношении побочных эффектов."
    when: "age >= 60"            # порог «пожилого» — 60 лет по классификации ВОЗ (Савва, 23.10)

interactions: []         # TODO: раздел «Взаимодействие»; у каждого severity: contraindicated | caution
dosing: {}               # TODO: {start_mg: , max_mg: , frequency: , duration: }
adverse_events: []       # TODO: [{term: "...", frequency: "часто", stop_drug: false}]

sources: [grls_aviandr, sponsor_deck_aviandr]
