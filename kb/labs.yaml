# Лабораторные показатели карточки пациента (раздел «Лабораторные исследования»).
# Врач вносит результат в единице отсюда; пункты инструкции читают последнее значение через lab('<id>')
# и показывают врачу показатели из labs (kb/README.md → «Препараты»).
# Нормы не задаём: система класс и стадию по анализам не вычисляет, это делает врач.
# TODO(Савва): проверить названия и единицы.
status: draft
labs:
  - { id: creatinine, title_ru: "Креатинин", unit: "мкмоль/л" }
  # Инструкция Авиандра пишет «СКФ < 60 мл/мин»; лаборатории обычно дают СКФ по CKD-EPI в мл/мин/1,73 м².
  # TODO(Савва): подтвердить, что сравниваем с 60 как есть.
  - { id: egfr, title_ru: "СКФ", name_ru: "Скорость клубочковой фильтрации", unit: "мл/мин/1,73 м²" }
  - { id: alt, title_ru: "АЛТ", name_ru: "Аланинаминотрансфераза", unit: "Ед/л" }
  - { id: ast, title_ru: "АСТ", name_ru: "Аспартатаминотрансфераза", unit: "Ед/л" }
  - { id: bilirubin, title_ru: "Общий билирубин", unit: "мкмоль/л" }
  - { id: albumin, title_ru: "Альбумин", unit: "г/л" }
  - { id: inr, title_ru: "МНО", name_ru: "Международное нормализованное отношение", unit: null }
